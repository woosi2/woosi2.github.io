    RESEARCH PROJECTS:
      - date_range: Mar 2026 – Present
        title: Identification of Microscopic Fatigue Mechanisms in Metallic Glasses Using Machine-Learned Interatomic Potentials (MLIP)
        highlights:
          - Developed a DFT-trained Moment Tensor Potential (MTP) for Zr–Ni–Al metallic glasses across a wide range of compositions, validating structural
            and dynamical properties.
          - Currently investigating microscopic fatigue mechanisms under cyclic loading by analyzing atomic-scale correlations between local structure and
            non-affine deformation.
      - date_range: Mar 2025 – Present
        title: Development of a Hybrid Monte Carlo–Molecular Dynamics (MC–MD) Method for Reliable Lipid Vesicle Equilibration
        highlights:
          - Developed a hybrid MC–MD method using interleaflet lipid swaps for efficient equilibration of ternary lipid vesicles.
          - Evaluated the traditional pore equilibration method by analyzing the convergence of leaflet composition, lipid numbers, and internal water
            content, and validated equilibrium properties against hybrid MC–MD.
      - date_range: Jul 2024 – Present
        title: Curvature-Induced Leaflet Asymmetry in Flip-Flop and Phase Behavior of Lipid Vesicles
        highlights:
          - Identified curvature-induced leaflet asymmetry in cholesterol flip-flop dynamics and phase behavior using coarse-grained MD simulations.
          - Analyzed leaflet-specific structural properties (APM, P2), cholesterol flip-flop dynamics, and free-energy profiles across varying cholesterol
            concentrations.
