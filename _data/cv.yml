    Research Projects:
      - bullet: "**Identification of Microscopic Fatigue Mechanisms in Metallic Glasses Using Machine-Learned Interatomic Potentials (MLIP)** · *Mar 2026 – Present*<br>Developed a DFT-trained Moment Tensor Potential (MTP) for Zr–Ni–Al metallic glasses across a wide range of compositions, validating structural and dynamical properties. Currently investigating microscopic fatigue mechanisms under cyclic loading by analyzing atomic scale correlations between local structure and non-affine deformation."
      - bullet: "**Development of a Hybrid Monte Carlo–Molecular Dynamics (MC–MD) Method for Reliable Lipid Vesicle Equilibration** · *Mar 2025 – Present*<br>Developed a hybrid MC–MD method using interleaflet lipid swaps for efficient equilibration of ternary lipid vesicles. Evaluated traditional pore equilibration method by analyzing the convergence of leaflet composition, lipid numbers, and internal water content, and validated equilibrium properties against hybrid MC–MD."
      - bullet: "**Curvature-Induced Leaflet Asymmetry in Flip-Flop and Phase Behavior of Lipid Vesicles** · *Jul 2024 – Present*<br>Identified curvature-induced leaflet asymmetry in cholesterol flip-flop dynamics and phase behavior using coarse-grained MD simulations. Analyzed leaflet-specific structural properties (APM, P2), cholesterol flip-flop dynamics and free-energy profiles across varying cholesterol concentrations."
      - bullet: "**Artificial Intelligence (AI) Applications in Chemistry: Trends, Opportunities, and Challenges** (Sponsored by Rebellions Inc., NPU Developer) · *Jun 2025 – Dec 2025*<br>Conducted an independent analysis of AI applications and emerging technologies across major fields of chemistry. Evaluated representative case studies, scalability, potential applications, and limitations of AI-based approaches."

